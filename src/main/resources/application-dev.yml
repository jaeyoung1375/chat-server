spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:p6spy:oracle:thin:@yggcv8zldawsd5fk_medium?TNS_ADMIN=/app/oracle/wallet
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
server:
  port: 9090
  address: 0.0.0.0

decorator:
  datasource:
    p6spy:
      enable: false

logging:
  level:
    p6spy: INFO
  file:
    name: /logs/app.log

file:
  upload:
    path: /app/upload
    server: /upload

app:
  frontend-url: http://localhost:3000 # TODO: 실제 배포 시 chat-app 주소로 교체 (로컬 전용 프로젝트라 현재 미사용)
  mobile-redirect-scheme: chatapp://oauth-callback
